<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Identity - Profile, Credentials -->
  <defs>
    <linearGradient id="identity-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- ID card -->
  <rect x="12" y="16" width="40" height="32" rx="4" fill="url(#identity-gradient)" opacity="0.9"/>
  <rect x="16" y="20" width="20" height="6" rx="2" fill="#FFFFFF" opacity="0.5"/>
  <rect x="16" y="30" width="24" height="4" rx="2" fill="#FFFFFF" opacity="0.5"/>
  <rect x="16" y="38" width="18" height="4" rx="2" fill="#FFFFFF" opacity="0.4"/>

  <!-- Profile circle -->
  <circle cx="44" cy="32" r="7" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="44" cy="30" r="2.5" fill="url(#identity-gradient)"/>
  <path d="M40.5 36.5 C42 34.5, 46 34.5, 47.5 36.5" stroke="url(#identity-gradient)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Aurora glow -->
  <circle cx="32" cy="32" r="18" fill="url(#identity-gradient)" opacity="0.12"/>
</svg>
