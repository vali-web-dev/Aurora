<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Realms - Portals, Spaces -->
  <defs>
    <linearGradient id="realms-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Portal rings -->
  <circle cx="32" cy="32" r="16" stroke="url(#realms-gradient)" stroke-width="3" opacity="0.9"/>
  <circle cx="32" cy="32" r="10" stroke="url(#realms-gradient)" stroke-width="2" opacity="0.7"/>
  <circle cx="32" cy="32" r="4" fill="url(#realms-gradient)"/>

  <!-- Arc accents -->
  <path d="M20 20 Q32 12, 44 20" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <path d="M20 44 Q32 52, 44 44" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>

  <!-- Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#realms-gradient)" opacity="0.1"/>
</svg>
