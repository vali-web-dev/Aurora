<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Learning - Knowledge, Growth -->
  <defs>
    <linearGradient id="learning-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F093FB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5576C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Open book with aurora pages -->
  <path d="M12 20 L12 48 Q16 44, 20 44 L32 44 L32 16 L20 16 Q16 16, 12 20" 
        fill="url(#learning-gradient)" opacity="0.8"/>
  <path d="M52 20 L52 48 Q48 44, 44 44 L32 44 L32 16 L44 16 Q48 16, 52 20" 
        fill="url(#learning-gradient)" opacity="0.8"/>
  
  <!-- Center spine -->
  <line x1="32" y1="16" x2="32" y2="44" stroke="#F5576C" stroke-width="2"/>
  
  <!-- Aurora glow -->
  <ellipse cx="32" cy="32" rx="24" ry="16" fill="#F093FB" opacity="0.15"/>
  
  <!-- Stars of knowledge -->
  <circle cx="20" cy="26" r="1.5" fill="#FFF"/>
  <circle cx="44" cy="26" r="1.5" fill="#FFF"/>
  <circle cx="20" cy="36" r="1.5" fill="#FFF"/>
  <circle cx="44" cy="36" r="1.5" fill="#FFF"/>
</svg>
