<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Social - Connection, Community -->
  <defs>
    <linearGradient id="social-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Connected nodes representing people -->
  <circle cx="20" cy="24" r="6" fill="url(#social-gradient)"/>
  <circle cx="44" cy="24" r="6" fill="url(#social-gradient)"/>
  <circle cx="32" cy="44" r="6" fill="url(#social-gradient)"/>
  
  <!-- Connection lines with aurora gradient -->
  <path d="M24 26 L28 30" stroke="#667EEA" stroke-width="2" opacity="0.6"/>
  <path d="M40 26 L36 30" stroke="#764BA2" stroke-width="2" opacity="0.6"/>
  <line x1="26" y1="28" x2="38" y2="28" stroke="url(#social-gradient)" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Glow effect -->
  <circle cx="32" cy="32" r="18" fill="url(#social-gradient)" opacity="0.1"/>
</svg>
