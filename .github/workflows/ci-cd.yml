name: Aurora CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'

jobs:
  # Lint and type-check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Type check
        run: npx tsc --noEmit

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --production --audit-level=moderate
        continue-on-error: true
      
      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # Build application
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Core CI Gates (Navigation + Env + Artifact Smoke)
        run: npm run ci:gates
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEXTAUTH_SECRET: test-secret-for-ci-build-only
          NEXTAUTH_URL: http://localhost:3000
          ARTIFACT_STORAGE_PROVIDER: local
          ARTIFACT_STORAGE_LOCAL_PATH: .

      - name: API Endpoint Runtime Contracts
        run: npm run api:endpoint-contracts
      
      - name: Build application (JSON telemetry)
        run: npm run build:json > build-ci-json.log 2>&1
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEXTAUTH_SECRET: test-secret-for-ci-build-only
          NEXTAUTH_URL: http://localhost:3000

      - name: Enforce Build Telemetry Gate (Balanced)
        run: node scripts/summarize-build-events.js --file build-ci-json.log --profile balanced

      - name: Upload Navigation Connectivity Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: navigation-connectivity-${{ github.run_id }}
          path: |
            artifacts/navigation-connectivity-report.json
            artifacts/navigation-connectivity-report.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Artifact Storage Smoke Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: artifact-storage-smoke-${{ github.run_id }}
          path: artifacts/artifact-storage-smoke.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Endpoint Contract Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: endpoint-contracts-${{ github.run_id }}
          path: artifacts/api-endpoint-contracts.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish Artifact Storage Smoke Summary
        if: always()
        run: node scripts/publish-artifact-smoke-summary.js --file artifacts/artifact-storage-smoke.json

      - name: Publish Endpoint Contract Summary
        if: always()
        run: node scripts/publish-endpoint-contract-summary.js --file artifacts/api-endpoint-contracts.json

      - name: Publish Build Badge Annotation
        if: always()
        run: |
          if [ ! -f build-ci-json.log ]; then
            echo "::warning title=Build Telemetry::build-ci-json.log not found"
            exit 0
          fi

          node scripts/summarize-build-events.js --file build-ci-json.log --profile balanced --github-summary || true
          node scripts/summarize-build-events.js --file build-ci-json.log --profile balanced --json > build-summary.json || true
          node scripts/summarize-build-events.js --file build-ci-json.log --profile balanced --markdown --out build-report.md || true

          BADGE_STATUS=$(node -e "const fs=require('fs');try{const s=JSON.parse(fs.readFileSync('build-summary.json','utf8'));process.stdout.write(String(s.badgeStatus||'unknown'));}catch{process.stdout.write('unknown');}")
          GATE_STATUS=$(node -e "const fs=require('fs');try{const s=JSON.parse(fs.readFileSync('build-summary.json','utf8'));process.stdout.write(String(s.gateStatus||'unknown'));}catch{process.stdout.write('unknown');}")
          ATTEMPTS_USED=$(node -e "const fs=require('fs');try{const s=JSON.parse(fs.readFileSync('build-summary.json','utf8'));process.stdout.write(String(s.attemptsUsed??'unknown'));}catch{process.stdout.write('unknown');}")
          TOTAL_MS=$(node -e "const fs=require('fs');try{const s=JSON.parse(fs.readFileSync('build-summary.json','utf8'));process.stdout.write(String(s.totalMs??'unknown'));}catch{process.stdout.write('unknown');}")

          if [ "$BADGE_STATUS" = "stable" ]; then
            echo "::notice title=Build Badge::✅ stable (attempts=$ATTEMPTS_USED totalMs=$TOTAL_MS gate=$GATE_STATUS)"
          elif [ "$BADGE_STATUS" = "retried" ]; then
            echo "::warning title=Build Badge::⚠️ retried (attempts=$ATTEMPTS_USED totalMs=$TOTAL_MS gate=$GATE_STATUS)"
          else
            echo "::error title=Build Badge::❌ $BADGE_STATUS (attempts=$ATTEMPTS_USED totalMs=$TOTAL_MS gate=$GATE_STATUS)"
          fi

      - name: Upload Build Telemetry Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-telemetry-${{ github.run_id }}
          path: |
            build-ci-json.log
            build-summary.json
            build-report.md
          if-no-files-found: ignore
          retention-days: 7
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: .next/
          retention-days: 1

  # Run tests (if you add tests later)
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aurora_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run database migrations
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/aurora_test
      
      # Placeholder for when tests are added
      - name: Run tests
        run: echo "No tests configured yet"
        # run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/aurora_test
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000

  # Deploy to staging (on develop branch)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.yourdomain.com
    steps:
      - uses: actions/checkout@v3
      
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: .next/
      
      - name: Deploy to Vercel (Staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
      
      # Or deploy to your own infrastructure
      # - name: Deploy to AWS/GCP/Azure
      #   run: |
      #     # Your deployment commands here

  # Deploy to production (on main branch)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://yourdomain.com
    steps:
      - uses: actions/checkout@v3
      
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: .next/
      
      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}
      
      - name: Notify deployment
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          # Add Slack/Discord notification here if needed
      
      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Manual rollback may be required."
          # Add rollback logic here

  # Accessibility check
  a11y:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v3
      
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: .next/
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v9
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/home
            http://localhost:3000/social
          uploadArtifacts: true
          temporaryPublicStorage: true
